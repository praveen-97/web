<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock for Surprise 🎂</title>
  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Abril+Fatface&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { border: none; background: none; cursor: pointer; }

    /* ══════════════════════════════════════════
       STRIPE BACKGROUND  (purple + cream)
    ══════════════════════════════════════════ */
    body {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      /* Exact stripe from reference: wide lavender + cream alternating */
      background-color: #d9aaee;
      background-image: repeating-linear-gradient(
        to right,
        #c598e8 0px,
        #c598e8 90px,
        #f7e9bb 90px,
        #f7e9bb 180px
      );
    }

    /* ══════════════════════════════════════════
       FULL-PAGE LAYOUT  – 3 columns
    ══════════════════════════════════════════ */
    .page {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(960px, 98vw);
      padding: 20px 32px;
      gap: 20px;
      position: relative;
    }

    /* ══════════════════════════════════════════
       LEFT SECTION
    ══════════════════════════════════════════ */
    .left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      flex: 0 0 280px;
    }

    /* "unlock" – big bold display font, purple */
    .title-unlock {
      font-family: 'Abril Fatface', serif;
      font-size: 86px;
      color: #7b4fc0;
      line-height: 0.95;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.06);
      letter-spacing: -2px;
    }

    /* "for surprise" – flowing script, white with subtle purple shadow */
    .title-surprise {
      font-family: 'Great Vibes', cursive;
      font-size: 58px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 2px 3px 8px rgba(100,50,160,0.35), 0 1px 0 rgba(160,100,220,0.5);
      margin-top: -8px;
      margin-left: 12px;
    }

    /* ── SCALLOPED FLOWER PHOTO FRAME ── */
    .frame-wrap {
      margin-top: 16px;
      position: relative;
      width: 220px;
      height: 220px;
      align-self: center;
    }

    /* The scalloped border is rendered via SVG (petals around a circle) */
    .frame-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .photo-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 158px;
      height: 158px;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid white;
      box-shadow: 0 4px 20px rgba(100,50,180,0.22);
      z-index: 2;
    }

    .photo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    /* ══════════════════════════════════════════
       CENTER CAT with party hat
    ══════════════════════════════════════════ */
    .center-art {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 160px;
    }

    /* ══════════════════════════════════════════
       RIGHT – WAVY PASSCODE PANEL
    ══════════════════════════════════════════ */
    .panel-wrap {
      flex: 0 0 auto;
      width: 300px;
      position: relative;
    }

    /* Wavy cream-coloured panel */
    .panel {
      background: #f7e9bb;
      border-radius: 32px;
      padding: 22px 26px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      /* Wavy edge via SVG clip-path on wrapper */
      position: relative;
      z-index: 1;
    }

    /* SVG wavy border overlay */
    .panel-border {
      position: absolute;
      inset: -3px;
      z-index: 0;
      pointer-events: none;
    }

    /* lock emoji */
    .lock-icon {
      font-size: 28px;
      line-height: 1;
    }

    .panel-label {
      font-size: 16px;
      font-weight: 700;
      color: #6b3faa;
      letter-spacing: 0.3px;
      margin-top: -6px;
    }

    /* ── 4 input boxes ── */
    .code-row {
      display: flex;
      gap: 10px;
    }

    .cb {
      width: 46px;
      height: 44px;
      border-radius: 9px;
      background: #a87fd4;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.18);
      transition: background 0.18s;
      position: relative;
      overflow: hidden;
    }
    .cb.filled  { background: #7c3aed; }
    .cb.error   { background: #dc2626; animation: jiggle 0.42s ease; }
    .cb.success { background: #16a34a; }

    @keyframes jiggle {
      0%,100% { transform: translateX(0); }
      18%     { transform: translateX(-5px); }
      36%     { transform: translateX(5px); }
      54%     { transform: translateX(-5px); }
      72%     { transform: translateX(4px); }
    }

    /* ── Keypad ── */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      width: 100%;
    }

    .key {
      background: #ffffff;
      border: 2.5px solid #c4a0e8;
      border-radius: 50%;
      width: 64px;
      height: 64px;
      font-family: 'Nunito', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
      cursor: pointer;
      /* underline like reference */
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1.5px;
      transition: background 0.14s, transform 0.1s, box-shadow 0.14s;
      box-shadow: 0 3px 10px rgba(130,70,210,0.12);
      user-select: none;
    }

    .key.sym { text-decoration: none; font-size: 22px; }
    .key:hover  { background: #ede9fe; }
    .key:active { transform: scale(0.9); background: #ddd6fe; }

    /* ── "enter" oval button ── */
    .enter-btn {
      background: white;
      border: 2.5px solid #a87fd4;
      border-radius: 30px;
      padding: 9px 36px;
      font-family: 'Nunito', sans-serif;
      font-size: 19px;
      font-weight: 800;
      color: #7c3aed;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: -2px;
      font-style: italic;
    }

    .enter-btn:hover  { background: #ede9fe; }
    .enter-btn:active { transform: scale(0.96); }

    /* ── small status text ── */
    .msg {
      font-size: 12px;
      font-weight: 700;
      color: #dc2626;
      min-height: 15px;
      text-align: center;
    }

    /* ══════════════════════════════════════════
       UNLOCK SUCCESS OVERLAY
    ══════════════════════════════════════════ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(245,235,255,0.88);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .overlay.show {
      display: flex;
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .overlay-emoji  { font-size: 78px; }
    .overlay-text   { font-family:'Great Vibes',cursive; font-size:58px; color:#7c3aed; text-shadow:0 2px 14px #c4b5fd; }
    .overlay-sub    { font-size:20px; font-weight:700; color:#7c3aed; }

    @keyframes popIn {
      from { opacity:0; transform:scale(0.7); }
      to   { opacity:1; transform:scale(1); }
    }

    /* confetti */
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity:0.4; }
    }
    .cfti {
      position: fixed;
      top: -20px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 201;
      animation: fall linear forwards;
    }
  </style>
</head>
<body>

<!-- Hidden SVG defs: wavy filter for the passcode panel -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="wf" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.030" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<!-- confetti mount -->
<div id="cfti"></div>

<!-- SUCCESS OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-emoji">🎉🎂🎉</div>
  <div class="overlay-text">Surprise for Nepal!</div>
  <div class="overlay-sub">Taking you there…</div>
</div>

<!-- ═══════════════════════════════════════════════
     MAIN PAGE
═══════════════════════════════════════════════ -->
<div class="page">

  <!-- ── LEFT ── -->
  <div class="left">
    <div class="title-unlock">unlock</div>
    <div class="title-surprise">for surprise</div>

    <!-- Scalloped frame -->
    <div class="frame-wrap">

      <!-- Purple scalloped flower ring (SVG) -->
      <svg class="frame-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Clip to a circle for the white backing -->
          <clipPath id="cc"><circle cx="110" cy="110" r="110"/></clipPath>
        </defs>

        <!-- Build scallop: a cluster of circles around the rim + big fill -->
        <!-- Outer petal circles (14 petals) -->
        <g fill="#9b5fd6">
          <circle cx="110" cy="8"   r="20"/>
          <circle cx="146" cy="19"  r="20"/>
          <circle cx="173" cy="46"  r="20"/>
          <circle cx="184" cy="81"  r="20"/>
          <circle cx="181" cy="118" r="20"/>
          <circle cx="163" cy="151" r="20"/>
          <circle cx="136" cy="172" r="20"/>
          <circle cx="103" cy="179" r="20"/>
          <circle cx="71"  cy="172" r="20"/>
          <circle cx="44"  cy="151" r="20"/>
          <circle cx="26"  cy="118" r="20"/>
          <circle cx="23"  cy="81"  r="20"/>
          <circle cx="34"  cy="46"  r="20"/>
          <circle cx="61"  cy="19"  r="20"/>
          <!-- Solid inner disc — covers the gaps -->
          <circle cx="110" cy="103" r="84" fill="#9b5fd6"/>
        </g>
        <!-- White inner ring -->
        <circle cx="110" cy="103" r="76" fill="white"/>
        <!-- thin purple outline ring -->
        <circle cx="110" cy="103" r="76" fill="none" stroke="#9b5fd6" stroke-width="3"/>
      </svg>

      <!-- Photo inside the frame -->
      <div class="photo-circle">
        <img src="assets/images/person.jpeg" alt="Nepal 🎂">
      </div>
    </div>
  </div>

  <!-- ── CENTER CAT + PARTY HAT ── -->
  <div class="center-art">
    <!--
      Hand-drawn cat-with-party-hat SVG
      Faithful to the halftone-dotted, slightly abstract cat in the reference image
    -->
    <svg width="158" height="200" viewBox="0 0 158 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- halftone-dot pattern for cat body -->
        <pattern id="ht" x="0" y="0" width="7" height="7" patternUnits="userSpaceOnUse">
          <circle cx="3.5" cy="3.5" r="1.4" fill="rgba(60,30,0,0.22)"/>
        </pattern>
        <!-- cream gradient for cat head -->
        <radialGradient id="catGrad" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#f0d9a0"/>
          <stop offset="100%" stop-color="#d4b87a"/>
        </radialGradient>
      </defs>

      <!-- ── PARTY HAT ── -->
      <!-- hat body (blue triangle) -->
      <polygon points="79,4 44,90 114,90" fill="#3058d8"/>
      <!-- hat shading -->
      <polygon points="79,4 79,90 114,90" fill="rgba(255,255,255,0.08)"/>
      <!-- brim ellipse -->
      <ellipse cx="79" cy="90" rx="36" ry="9" fill="#4166e0" stroke="#2545b4" stroke-width="1.5"/>
      <!-- Gold stars on hat -->
      <text x="58" y="53" font-size="16" fill="#FFD700" font-family="serif">★</text>
      <text x="74" y="38" font-size="12" fill="#FFD700" font-family="serif">★</text>
      <text x="85" y="62" font-size="13" fill="#FFD700" font-family="serif">★</text>
      <text x="50" y="74" font-size="11" fill="#FFD700" font-family="serif">★</text>
      <text x="88" y="78" font-size="11" fill="#FFD700" font-family="serif">★</text>
      <text x="68" y="82" font-size="10" fill="#FFD700" font-family="serif">★</text>
      <!-- tip star -->
      <circle cx="79" cy="7" r="5" fill="#FFD700"/>

      <!-- ── EARS ── -->
      <polygon points="33,92 24,66 55,92" fill="#c8a56a"/>
      <polygon points="125,92 134,66 103,92" fill="#c8a56a"/>
      <!-- inner ear -->
      <polygon points="37,90 31,72 50,90" fill="#e8a8b0"/>
      <polygon points="121,90 127,72 108,90" fill="#e8a8b0"/>

      <!-- ── CAT HEAD (halftone effect) ── -->
      <!-- base colour -->
      <ellipse cx="79" cy="130" rx="52" ry="50" fill="url(#catGrad)"/>
      <!-- halftone dot overlay -->
      <ellipse cx="79" cy="130" rx="52" ry="50" fill="url(#ht)"/>
      <!-- subtle edge shading -->
      <ellipse cx="79" cy="130" rx="52" ry="50" fill="none" stroke="rgba(100,60,10,0.12)" stroke-width="2"/>

      <!-- ── EYES (sleepy, half-lid) ── -->
      <!-- eye whites -->
      <ellipse cx="60" cy="123" rx="11" ry="8" fill="white"/>
      <ellipse cx="98" cy="123" rx="11" ry="8" fill="white"/>
      <!-- irises -->
      <ellipse cx="60" cy="125" rx="7" ry="6" fill="#4a2a08"/>
      <ellipse cx="98" cy="125" rx="7" ry="6" fill="#4a2a08"/>
      <!-- pupils -->
      <ellipse cx="61" cy="126" rx="4" ry="4.5" fill="#100500"/>
      <ellipse cx="99" cy="126" rx="4" ry="4.5" fill="#100500"/>
      <!-- upper eyelid (sleepy look) -->
      <path d="M49,120 Q60,115 71,120" stroke="#7a4a18" stroke-width="2" fill="rgba(180,120,50,0.3)" stroke-linecap="round"/>
      <path d="M87,120 Q98,115 109,120" stroke="#7a4a18" stroke-width="2" fill="rgba(180,120,50,0.3)" stroke-linecap="round"/>
      <!-- shine spots -->
      <circle cx="64" cy="122" r="2.5" fill="white" opacity="0.9"/>
      <circle cx="102" cy="122" r="2.5" fill="white" opacity="0.9"/>

      <!-- ── NOSE ── -->
      <polygon points="79,134 74,141 84,141" fill="#d07080"/>
      <path d="M74,141 Q79,147 84,141" stroke="#a05060" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- ── WHISKERS ── -->
      <line x1="16" y1="130" x2="65" y2="136" stroke="#805c2a" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="14" y1="140" x2="65" y2="140" stroke="#805c2a" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="18" y1="150" x2="65" y2="144" stroke="#805c2a" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="142" y1="130" x2="93" y2="136" stroke="#805c2a" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="144" y1="140" x2="93" y2="140" stroke="#805c2a" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="140" y1="150" x2="93" y2="144" stroke="#805c2a" stroke-width="1.3" stroke-linecap="round"/>

      <!-- ── BLUSH CHEEKS ── -->
      <ellipse cx="46" cy="144" rx="12" ry="6" fill="rgba(240,130,140,0.4)"/>
      <ellipse cx="112" cy="144" rx="12" ry="6" fill="rgba(240,130,140,0.4)"/>

      <!-- ── CREAM HALFTONE BG CIRCLE (behind cat, like reference) ── -->
      <!-- drawn first so cat ears and head appear in front -->
    </svg>
  </div>

  <!-- ── RIGHT: PASSCODE PANEL ── -->
  <div class="panel-wrap">
    <!-- Wavy border rendered via inline SVG + CSS filter -->
    <div style="filter:url(#wf); position:relative;">
      <div class="panel">
        <div class="lock-icon">🔒</div>
        <div class="panel-label">Enter passcode</div>

        <!-- 4 indicator squares -->
        <div class="code-row" id="codeRow">
          <div class="cb" id="cb0"></div>
          <div class="cb" id="cb1"></div>
          <div class="cb" id="cb2"></div>
          <div class="cb" id="cb3"></div>
        </div>

        <!-- Keypad -->
        <div class="keypad">
          <button class="key" onclick="press('1')">1</button>
          <button class="key" onclick="press('2')">2</button>
          <button class="key" onclick="press('3')">3</button>
          <button class="key" onclick="press('4')">4</button>
          <button class="key" onclick="press('5')">5</button>
          <button class="key" onclick="press('6')">6</button>
          <button class="key" onclick="press('7')">7</button>
          <button class="key" onclick="press('8')">8</button>
          <button class="key" onclick="press('9')">9</button>
          <button class="key sym" onclick="press('#')">#</button>
          <button class="key" onclick="press('0')">0</button>
          <button class="key sym" onclick="del()">⌫</button>
        </div>

        <div class="msg" id="msg"></div>

        <button class="enter-btn" onclick="submit()">enter</button>
      </div>
    </div>
  </div>

</div><!-- .page -->

<script>
// ──────────────────────────────────────────────────────────────
//  CONFIG:  Set Nepal's DOB in DDMM format
//  e.g. 19 Sept → '1909'
// ──────────────────────────────────────────────────────────────
const SECRET = '2009';       // ← Nepal's DOB  DD MM
const NEXT   = 'birthday.html'; // ← where to go after unlock

let code = '';

function syncBoxes() {
  for (let i = 0; i < 4; i++) {
    const b = document.getElementById('cb' + i);
    b.classList.remove('filled','error','success');
    if (i < code.length) b.classList.add('filled');
  }
}

function press(v) {
  if (code.length >= 4) return;
  if (v === '#' || v === '*') return; // decorative keys
  code += v;
  document.getElementById('msg').textContent = '';
  syncBoxes();
}

function del() {
  code = code.slice(0, -1);
  document.getElementById('msg').textContent = '';
  syncBoxes();
}

function submit() {
  if (code.length < 4) {
    document.getElementById('msg').textContent = '⚠ Enter all 4 digits';
    return;
  }
  if (code === SECRET) {
    // ── Correct! ──
    for (let i = 0; i < 4; i++)
      document.getElementById('cb' + i).classList.replace('filled','success') ||
      document.getElementById('cb' + i).classList.add('success');
    document.getElementById('msg').textContent = '🎉 Correct!';
    document.getElementById('msg').style.color = '#16a34a';
    spawnConfetti();
    setTimeout(() => document.getElementById('overlay').classList.add('show'), 350);
    setTimeout(() => window.location.href = NEXT, 2700);
  } else {
    // ── Wrong ──
    for (let i = 0; i < 4; i++) {
      const b = document.getElementById('cb' + i);
      b.classList.remove('filled','success');
      b.classList.add('error');
    }
    document.getElementById('msg').textContent = '✗ Wrong! Try again 💜';
    document.getElementById('msg').style.color = '#dc2626';
    setTimeout(() => {
      for (let i = 0; i < 4; i++)
        document.getElementById('cb' + i).classList.remove('error');
      code = '';
      syncBoxes();
      document.getElementById('msg').textContent = '';
    }, 950);
  }
}

// keyboard support
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') press(e.key);
  else if (e.key === 'Backspace') del();
  else if (e.key === 'Enter') submit();
});

// confetti
const COLS = ['#a78bfa','#fbbf24','#34d399','#f472b6','#60a5fa','#fde68a','#c084fc'];
function spawnConfetti() {
  const m = document.getElementById('cfti');
  for (let i = 0; i < 100; i++) {
    const el = document.createElement('div');
    el.className = 'cfti';
    el.style.cssText = `
      left:${Math.random()*100}vw;
      width:${7+Math.random()*9}px;
      height:${11+Math.random()*10}px;
      background:${COLS[Math.random()*COLS.length|0]};
      animation-duration:${1.4+Math.random()*2}s;
      animation-delay:${Math.random()*0.8}s;
      border-radius:${Math.random()>.5?'50%':'3px'};
    `;
    m.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}
</script>
</body>
</html>
